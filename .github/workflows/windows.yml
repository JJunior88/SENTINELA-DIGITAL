name: Aplicativo Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testar aplicação
        run: python -m unittest discover -s tests -v
      - name: Instalar ferramenta de empacotamento
        run: python -m pip install pyinstaller==6.16.0
      - name: Gerar executável independente
        run: python -m PyInstaller --noconfirm --clean --onefile --name SentinelaDigital --add-data "index.html:." desktop.py
      - name: Testar executável Windows
        run: python scripts/smoke_desktop.py dist/SentinelaDigital.exe
      - name: Incluir instruções e checksum
        shell: pwsh
        run: |
          Copy-Item LEIA-ME-WINDOWS.txt dist/
          (Get-FileHash dist/SentinelaDigital.exe -Algorithm SHA256).Hash | Set-Content dist/SentinelaDigital.exe.sha256
      - name: Disponibilizar download
        uses: actions/upload-artifact@v6
        with:
          name: SentinelaDigital-Windows
          path: |
            dist/SentinelaDigital.exe
            dist/SentinelaDigital.exe.sha256
            dist/LEIA-ME-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30
